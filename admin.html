<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Untitled UI</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  body { background: var(--gray-50); }
  .admin { padding: 64px 0; }
  .admin h1 { font-size: 28px; margin: 0 0 24px; }
  .admin-card { background: var(--white); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 24px; margin-bottom: 24px; }
  .admin-login { max-width: 400px; margin: 0 auto; }
  .admin-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .admin-bar h2 { margin: 0; font-size: 20px; }
  .table-wrap { overflow-x: auto; }
  .admin table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .admin th, .admin td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
  .admin th { color: var(--gray-700); font-weight: 600; white-space: nowrap; }
  .admin td.msg { white-space: pre-wrap; word-break: break-word; }
  .admin .empty { color: var(--gray-500, #667085); padding: 12px 0; }
  .admin .btn { cursor: pointer; }
</style>
</head>
<body>
<main class="admin">
  <div class="container container--narrow" style="max-width: 960px;">
    <h1>Panel de administración</h1>

    <!-- Login -->
    <section id="login-view" class="admin-card admin-login" hidden>
      <form id="login-form" class="form" novalidate>
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" name="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span class="field-label">Contraseña</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Entrar</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Panel (sin datos hasta que haya sesión) -->
    <div id="panel-view" hidden>
      <div class="admin-bar">
        <p id="session-email" class="field-label" style="margin:0"></p>
        <button id="logout" type="button" class="btn btn-secondary">Cerrar sesión</button>
      </div>

      <section class="admin-card">
        <div class="admin-bar">
          <h2>Signups <span id="signups-count" class="field-label"></span></h2>
          <button id="download-csv" type="button" class="btn btn-primary">Descargar CSV</button>
        </div>
        <p id="panel-status" class="form-status is-error" role="status"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Email</th><th>Fecha</th></tr></thead>
            <tbody id="signups-body"></tbody>
          </table>
        </div>
        <p id="signups-empty" class="empty" hidden>Aún no hay registros.</p>
      </section>

      <section class="admin-card">
        <div class="admin-bar">
          <h2>Feedback <span id="feedback-count" class="field-label"></span></h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Email</th><th>Comentario</th></tr></thead>
            <tbody id="feedback-body"></tbody>
          </table>
        </div>
        <p id="feedback-empty" class="empty" hidden>Aún no hay comentarios.</p>
      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
